name: Deploy demo to GitHub Pages

# The demo has no backend, so the build also generates the static JSON the app
# fetches — real HTTP requests, answered by files published beside the bundle.
on:
  push:
    branches: [main, Wallet]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - name: Build demo
        run: npm run build:demo
      - name: Add SPA fallback
        # GitHub Pages serves 404.html for unknown paths; the app routes them.
        run: cp dist/Matdash/browser/index.html dist/Matdash/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/Matdash/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
